# Checks every push and pull request: lint, types, tests, and the build.
# Nothing is deployed here and no secrets are used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the docs check reads the commits of the push
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Backstop for the local commit hook: every pushed commit that changes mapped code must
      # change its docs (a "[docs-ok] <reason>" line in a commit message skips that commit)
      - name: Docs match code
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF..HEAD"
          else
            RANGE="$BEFORE..$SHA"
          fi
          START="${RANGE%%..*}"
          # A push to main is a merge of work whose commits were already checked one by one on the
          # branch, so a long range is checked as a whole (docs changed somewhere in it)
          MODE=""
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then MODE="--aggregate"; fi
          if git cat-file -e "$START^{commit}" 2>/dev/null; then
            node scripts/docs-check.mjs --range "$RANGE" $MODE
          else
            echo "No earlier commit to compare with (new branch or rewritten history): skipped."
          fi
