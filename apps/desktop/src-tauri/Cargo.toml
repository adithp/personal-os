[package]
name = "personal-os-desktop"
version = "0.1.0"
description = "Personal OS desktop app"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "personal_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
